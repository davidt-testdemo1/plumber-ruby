# .github/workflows/tudovu-secure-pipeline.yml
name: Tudovu Secure Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  build-test-secure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dockerfile is added by this pull request.
      - name: Build application image
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker build -t "app:$GIT_SHA" .
      - name: Detect CodeQL languages
        id: codeql_langs
        run: |
          LANGS=""
          if [ -f package.json ]; then LANGS="$LANGS,javascript-typescript"; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f Pipfile ]; then LANGS="$LANGS,python"; fi
          if [ -f go.mod ]; then LANGS="$LANGS,go"; fi
          echo "languages=${LANGS#,}" >> "$GITHUB_OUTPUT"
      - name: CodeQL init
        if: steps.codeql_langs.outputs.languages != ''
        continue-on-error: true
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ steps.codeql_langs.outputs.languages }}
      - name: CodeQL autobuild
        if: steps.codeql_langs.outputs.languages != ''
        continue-on-error: true
        uses: github/codeql-action/autobuild@v3
      - name: CodeQL analyze (SAST. Needs GitHub Advanced Security to publish results)
        if: steps.codeql_langs.outputs.languages != ''
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
      - name: Semgrep policy scan (SAST)
        run: |
          python -m pip install --quiet semgrep
          semgrep scan --config=auto --severity=ERROR --error --quiet
      - name: Unit tests
        run: |
          if [ -f package.json ]; then
            # Install before testing: a container build leaves the runner with no
            # node_modules, so the repo's test binary would not exist.
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test --if-present
          elif [ -f go.mod ]; then
            go test ./...
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            if [ -f requirements.txt ]; then python -m pip install -r requirements.txt >/dev/null 2>&1 || true; fi
            python -m pip install pytest >/dev/null 2>&1 && pytest --no-header -q || echo "No pytest suite."
          else
            echo "No recognized test manifest. Skipping tests."
          fi
      - name: Trivy dependency scan (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 1
      - name: Trivy dependency scan (JSON artifact)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: 0
      - name: Trivy base image scan (advisory, does not block)
        # Base image + OS packages + vendored packaging tooling. Not reachable from
        # any dependency manifest, so blocking on these would leave a diligent repo
        # permanently red. Tudovu selected this base image, so these are ours to fix.
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 0
      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore
      # DAST runs against the deployed site. Set the STAGING_URL repo variable to enable it.
      # The STAGING_URL repo variable always overrides.
      - name: OWASP ZAP baseline (DAST)
        if: vars.STAGING_URL != ''
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
      - name: DAST skipped (no target)
        if: vars.STAGING_URL == ''
        run: echo "Set the STAGING_URL repo variable to run the OWASP ZAP (DAST) gate against your staging URL."
      # Deploy on main, only when a starter stack is present (the website path
      # ships infra/website.yaml + its own deploy workflow instead). Assumes the
      # foundation OIDC deploy role. Same role + region vars as the deploy workflow.
      - name: Configure AWS for deploy (OIDC)
        if: github.ref == 'refs/heads/main' && hashFiles('infra/stack.yaml') != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TUDOVU_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.TUDOVU_AWS_REGION || 'us-east-1' }}
      - name: Deploy CloudFormation stack
        if: github.ref == 'refs/heads/main' && hashFiles('infra/stack.yaml') != ''
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
        run: aws cloudformation deploy --template-file infra/stack.yaml --stack-name "tudovu-$REPO_NAME-app" --capabilities CAPABILITY_IAM --region ${{ vars.TUDOVU_AWS_REGION || 'us-east-1' }} --tags "tudovu:repo=$REPO_FULL"
      - name: Roll out AWS
        if: github.ref == 'refs/heads/main' && hashFiles('infra/stack.yaml') != ''
        run: echo "Deployed AWS via CloudFormation after passing the security gates."